image: node:22-bookworm

stages:
  - verify
  - deploy

cache:
  key:
    files:
      - web/package-lock.json
  paths:
    - web/node_modules/

build:
  stage: verify
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    when: always
    paths:
      - web/dist/
    expire_in: 1 day

vercel-production:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/import-september-history"'
      when: on_success
  script:
    - npm install --global vercel@latest
    - vercel link --yes --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
    - vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
    - vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
  variables:
    VERCEL_TOKEN: $VERCEL_TOKEN
    VERCEL_ORG_ID: $VERCEL_ORG_ID
    VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
