image: node:22-bookworm

stages:
  - verify
  - deploy

cache:
  key:
    files:
      - web/package-lock.json
  paths:
    - web/node_modules/

build:
  stage: verify
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    when: always
    paths:
      - web/dist/
    expire_in: 1 day

cloudflare-pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/import-september-history"'
      when: on_success
  script:
    - cd web
    - npm install --global wrangler@4
    - wrangler pages deploy dist --project-name=flash-player-dashboard
  variables:
    CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
    CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
